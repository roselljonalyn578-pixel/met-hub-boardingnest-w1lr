<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website Group System - Manage and organize your favorite websites with a cyberpunk neon theme">
    <meta name="keywords" content="website manager, group system, cyberpunk, neon theme, web portal">
    <meta name="author" content="Website Group System">
    <meta property="og:title" content="Website Group System">
    <meta property="og:description" content="Manage and organize your favorite websites with a cyberpunk neon theme">
    <meta property="og:type" content="website">
    <title>{% block title %}Website Group System{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #001122 0%, #003366 50%, #0066cc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️ 🔒 🏠 🔐 🏡 🔓 🏘️';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            font-size: 30px;
            opacity: 0.1;
            z-index: -1;
            filter: blur(2px);
            animation: float 20s infinite linear;
            pointer-events: none;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #0066ff;
        }
        @keyframes float {
            0% { transform: translate(-10%, -10%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .nav {
            text-align: center;
            margin-bottom: 30px;
        }
        .nav a {
            margin: 0 10px;
            padding: 10px 20px;
            background: rgba(0, 123, 255, 0.8);
            color: #00ffff;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .nav a:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        .messages {
            margin-bottom: 20px;
        }
        .alert {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Website Group System</h1>
    </div>
    
    <div class="nav">
        <a href="{% url 'website_list' %}">View Websites</a>
        <a href="{% url 'add_website' %}">Add Website</a>
    </div>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
