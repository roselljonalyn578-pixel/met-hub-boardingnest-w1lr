<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Group System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .website-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .website-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s;
        }
        .website-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .website-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .website-url {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Website Group System</h1>
    
    <div class="website-grid">
        <a href="https://m-e-t-hub.render.com" target="_blank" class="website-card">
            <div class="website-name">Google</div>
            <div class="website-url">www.google.com</div>
        </a>
        
        <a href="https://www.youtube.com" target="_blank" class="website-card">
            <div class="website-name">YouTube</div>
            <div class="website-url">www.youtube.com</div>
        </a>
        
        <a href="https://www.github.com" target="_blank" class="website-card">
            <div class="website-name">GitHub</div>
            <div class="website-url">www.github.com</div>
        </a>
        
        <a href="https://www.stackoverflow.com" target="_blank" class="website-card">
            <div class="website-name">Stack Overflow</div>
            <div class="website-url">www.stackoverflow.com</div>
        </a>
        
        <a href="https://www.reddit.com" target="_blank" class="website-card">
            <div class="website-name">Reddit</div>
            <div class="website-url">www.reddit.com</div>
        </a>
        
        <a href="https://www.twitter.com" target="_blank" class="website-card">
            <div class="website-name">Twitter</div>
            <div class="website-url">www.twitter.com</div>
        </a>
    </div>
</body>
</html>
